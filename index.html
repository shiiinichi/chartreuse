<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        const scheme = localStorage.getItem('chartreuse-scheme');
        if (scheme === 'light' || scheme === 'dark') document.querySelector('meta[name="color-scheme"]').content = scheme;
      } catch {}
    </script>
    <meta name="theme-color" content="#024340" />
    <meta name="description" content="Chartreuse React 19 component library. API reference, design tokens, and interface examples." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Overview · Chartreuse Design System</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
